baseURL = "https://example.github.io/"
title = "My Blog"
paginate = 10
theme = "PaperMod"
defaultContentLanguage = "zh"
hasCJKLanguage = true

[params]
  author = "Blog Author"
  description = "A personal blog built with Hugo and PaperMod"
  keywords = ["blog", "personal", "hugo"]
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  TocOpen = false

[params.homeInfoParams]
  Title = "Welcome to My Blog"
  Content = "记录技术、生活与思考"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/"

[params.assets]
  favicon = "/favicon.ico"
  disableHLJS = false

[params.fuse]
  isCaseSensitive = false
  minMatchCharLength = 2
  threshold = 0.3
  ignoreLocation = true

[params.editPost]
  URL = ""
  Text = "Suggest Changes"
  appendFilePath = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params.analytics]
  [params.analytics.goatcounter]
    code = ""

[params.comments]
  [params.comments.giscus]
    repo = ""
    repoId = ""
    category = ""
    categoryId = ""
    mapping = "pathname"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "top"
    theme = "preferred_color_scheme"
    lang = "zh-CN"

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = false
    style = "dracula"

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[minify]
  disableXML = true
  minifyOutput = true

[[menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 1

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 5

[[menu.main]]
  identifier = "categories"
  name = "分类"
  url = "/categories/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 15

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 20

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 25
