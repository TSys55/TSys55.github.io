name: GoatCounter Backup

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to back up (0 = all)'
        required: false
        default: '7'

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      GC_CODE: tsys55
      GC_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
      BACKUP_DAYS: ${{ inputs.days || '7' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run backup
        run: python3 scripts/gc-backup.py

      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/goatcounter-backup/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: GoatCounter backup $(date +%Y-%m-%d)"
          git push
