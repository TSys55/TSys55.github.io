name: GoatCounter Backup

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      GC_CODE: tsys55
      GC_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create export
        id: create
        run: |
          BODY='{}'
          LAST_FILE="data/goatcounter-backup/.last-export"
          if [ -f "$LAST_FILE" ]; then
            LAST_ID=$(cat "$LAST_FILE")
            BODY="{\"start_from_hit_id\": $LAST_ID}"
          fi
          RESP=$(curl -s -X POST "https://${GC_CODE}.goatcounter.com/api/v0/export" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${GC_TOKEN}" \
            -d "$BODY")
          echo "resp=$RESP" >> "$GITHUB_OUTPUT"
          ID=$(echo "$RESP" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          if [ -z "$ID" ]; then
            echo "Failed to create export: $RESP"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Export created: id=$ID"

      - name: Wait for export
        run: |
          for i in $(seq 1 30); do
            sleep 10
            RESP=$(curl -s "https://${GC_CODE}.goatcounter.com/api/v0/export/${{ steps.create.outputs.id }}" \
              -H "Authorization: Bearer ${GC_TOKEN}")
            STATUS=$(echo "$RESP" | grep -o '"state":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "Attempt $i: state=$STATUS"
            if [ "$STATUS" = "done" ]; then
              LAST_HIT=$(echo "$RESP" | grep -o '"last_hit_id":[0-9]*' | head -1 | cut -d: -f2)
              echo "Export ready. last_hit_id=$LAST_HIT"
              echo "$LAST_HIT" > data/goatcounter-backup/.last-export
              exit 0
            fi
          done
          echo "Export timed out"
          exit 1

      - name: Download export
        run: |
          mkdir -p data/goatcounter-backup
          DATE=$(date +%Y-%m-%d)
          curl -s "https://${GC_CODE}.goatcounter.com/api/v0/export/${{ steps.create.outputs.id }}/download" \
            -H "Authorization: Bearer ${GC_TOKEN}" \
            -o "data/goatcounter-backup/${DATE}.csv.gz"
          gunzip -f "data/goatcounter-backup/${DATE}.csv.gz"
          echo "Downloaded: data/goatcounter-backup/${DATE}.csv"
          head -5 "data/goatcounter-backup/${DATE}.csv"

      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/goatcounter-backup/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: GoatCounter backup $(date +%Y-%m-%d)"
          git push
