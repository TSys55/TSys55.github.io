name: GoatCounter Backup

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      GC_CODE: tsys55
      GC_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create export
        id: create
        run: |
          set -x
          echo "GC_CODE=${GC_CODE}"
          echo "GC_TOKEN length=${#GC_TOKEN}"
          if [ -z "$GC_TOKEN" ]; then
            echo "ERROR: GOATCOUNTER_API_TOKEN secret is not set"
            exit 1
          fi
          BODY='{"format":"csv"}'
          LAST_FILE="data/goatcounter-backup/.last-export"
          if [ -f "$LAST_FILE" ]; then
            LAST_ID=$(cat "$LAST_FILE")
            BODY="{\"format\":\"csv\",\"start_from_hit_id\": $LAST_ID}"
          fi
          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/gc-export-resp.json \
            -X POST "https://${GC_CODE}.goatcounter.com/api/v0/export" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${GC_TOKEN}" \
            -d "$BODY")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/gc-export-resp.json
          RESP=$(cat /tmp/gc-export-resp.json)
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: API returned HTTP $HTTP_CODE"
            exit 1
          fi
          ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          if [ -z "$ID" ]; then
            echo "ERROR: Could not parse export id from response"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Export created: id=$ID"

      - name: Wait for export
        run: |
          for i in $(seq 1 30); do
            sleep 10
            RESP=$(curl -s "https://${GC_CODE}.goatcounter.com/api/v0/export/${{ steps.create.outputs.id }}" \
              -H "Authorization: Bearer ${GC_TOKEN}")
            STATUS=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('state',''))" 2>/dev/null || echo "")
            echo "Attempt $i: state=$STATUS"
            if [ "$STATUS" = "done" ]; then
              LAST_HIT=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('last_hit_id',''))" 2>/dev/null || echo "")
              echo "Export ready. last_hit_id=$LAST_HIT"
              mkdir -p data/goatcounter-backup
              echo "$LAST_HIT" > data/goatcounter-backup/.last-export
              exit 0
            fi
          done
          echo "Export timed out"
          exit 1

      - name: Download export
        run: |
          mkdir -p data/goatcounter-backup
          DATE=$(date +%Y-%m-%d)
          curl -s "https://${GC_CODE}.goatcounter.com/api/v0/export/${{ steps.create.outputs.id }}/download" \
            -H "Authorization: Bearer ${GC_TOKEN}" \
            -o "data/goatcounter-backup/${DATE}.csv.gz"
          gunzip -f "data/goatcounter-backup/${DATE}.csv.gz"
          echo "Downloaded: data/goatcounter-backup/${DATE}.csv"
          head -5 "data/goatcounter-backup/${DATE}.csv"

      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/goatcounter-backup/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: GoatCounter backup $(date +%Y-%m-%d)"
          git push
